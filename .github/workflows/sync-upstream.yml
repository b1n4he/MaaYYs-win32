name: Sync Upstream Activities and Release

on:
  schedule:
    # 每 6 小时检查一次上游（UTC，北京时间为 08/14/20/02 点）
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync upstream activities only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/TanyaShue/MaaYYs.git

      - name: Fetch upstream
        run: |
          git fetch upstream main
          git fetch origin main

      - name: Check for upstream updates
        id: check
        run: |
          NEW=$(git rev-list --count origin/main..upstream/main)
          echo "New upstream commits: $NEW"
          if [ "$NEW" -gt 0 ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "No upstream updates, skip."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cherry-pick activity commits only
        id: sync
        if: steps.check.outputs.has_update == 'true'
        run: |
          git checkout main
          NEW_COMMITS=$(git rev-list --reverse origin/main..upstream/main)
          SYNCED=0
          for commit in $NEW_COMMITS; do
            MSG=$(git log -1 --format=%s "$commit")
            FILES=$(git diff-tree --no-commit-id --name-only -r "$commit")
            if echo "$FILES" | grep -qE "tasks/(活动|花车|限时活动)|pipeline/活动/"; then
              echo "活动提交，cherry-pick: $commit $MSG"
              if git cherry-pick "$commit"; then
                SYNCED=$((SYNCED+1))
              else
                echo "::warning::cherry-pick 冲突，跳过: $MSG"
                git cherry-pick --abort
              fi
            else
              echo "跳过非活动提交: $commit $MSG"
            fi
          done
          if [ "$SYNCED" -gt 0 ]; then
            git push origin main
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "无活动相关更新"
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag
        if: steps.check.outputs.has_update == 'true' && steps.sync.outputs.synced == 'true'
        run: |
          VERSION=$(python3 -c "import json,re; v=json.load(open('interface.json',encoding='utf-8')).get('version',''); m=re.match(r'v?(\d+\.\d+\.\d+)', v); print(m.group(1) if m else '')")
          if [ -z "$VERSION" ]; then
            echo "::warning::无法从 interface.json 解析版本号，跳过 release"
            exit 0
          fi
          TAG="v${VERSION}-$(date +%y%m%d%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "已推送 tag $TAG，将触发 build-release 自动打包发布"
